name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Backend Tests
        env:
          SECRET_KEY: 'jokerjokerjokerjokerjokerjokerjoker1' # false key
          DATABASE_URL: 'sqlite:///db.sqlite3' # false local database
          DEBUG: 'True'
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py test

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy Backend
        run: |
          gcloud run deploy jezicko-backend \
            --source ./backend \
            --region europe-west3 \
            --allow-unauthenticated \
            --port 8000 \
            --add-cloudsql-instances jezicko-app:europe-west3:jezicko-db-instance \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},DEBUG=False,SECRET_KEY=${{ secrets.SECRET_KEY }}"

      - name: Build and Deploy Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JEZICKO_APP }}'
          projectId: jezicko-app-21032
          channelId: live 
          entryPoint: "./frontend"